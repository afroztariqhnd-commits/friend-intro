<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My First Website</title>

<style>
    body {
        background-color: black;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
    }

    h1 {
        margin-bottom: 10px;
    }

    h3 {
        color: #00ff88;
        font-size: 25px;
    }

    a {
        color: #00aaff;
    }

    #searchBox {
        width: 90%;
        max-width: 500px;
        padding: 12px;
        margin: 20px auto;
        border-radius: 8px;
        border: 1px solid white;
        font-size: 16px;
        display: block;
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        margin: 5px;
    }

    #addBtn {
        background-color: #00cc66;
        color: white;
        font-weight: bold;
    }

    #saveBtn {
        background-color: #008cff;
        color: white;
    }

    #cancelBtn {
        background-color: #555;
        color: white;
    }

    #addForm {
        display: none;
        width: 90%;
        max-width: 500px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #444;
        border-radius: 12px;
        background-color: #111;
        box-sizing: border-box;
    }

    #addForm h2 {
        color: #00ff88;
    }

    #addForm input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 7px;
        border: 1px solid #555;
        box-sizing: border-box;
        font-size: 16px;
    }

    #photoPreview {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        display: none;
        margin: 10px auto;
        border: 2px solid #00ff88;
    }

    .table-container {
        width: 100%;
        overflow-x: auto;
        margin-top: 20px;
    }

    table {
        width: 100%;
        min-width: 700px;
        border-collapse: collapse;
    }

    th, td {
        border: 1px solid white;
        padding: 10px;
        text-align: center;
    }

    th {
        background-color: #222;
        color: #00ff88;
    }

    tr:nth-child(even) {
        background-color: #111;
    }

    .profile-img {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        object-fit: cover;
    }

    .delete-btn {
        background-color: #e60000;
        color: white;
        padding: 8px 12px;
        font-size: 14px;
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        h1 {
            font-size: 25px;
        }

        h3 {
            font-size: 21px;
        }

        th, td {
            padding: 8px;
        }
    }
</style>
</head>

<body>

<h1>Welcome! This is my first website.</h1>

<h3>FRIENDS DIRECTORY</h3>

<p>
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>
</p>

<!-- SEARCH -->
<input
    type="text"
    id="searchBox"
    placeholder="Search friend..."
    onkeyup="searchTable()"
>

<!-- ADD BUTTON -->
<button id="addBtn" onclick="showForm()">
    ➕ Add New
</button>

<!-- ADD FORM -->
<div id="addForm">

    <h2>Add New Friend</h2>

    <!-- PHOTO -->
    <input
        type="file"
        id="photoInput"
        accept="image/*"
        onchange="previewPhoto(event)"
    >

    <img id="photoPreview">

    <!-- NAME -->
    <input
        type="text"
        id="nameInput"
        placeholder="Enter Name"
    >

    <!-- PHONE -->
    <input
        type="tel"
        id="phoneInput"
        placeholder="Enter Phone Number"
    >

    <!-- ADDRESS -->
    <input
        type="text"
        id="addressInput"
        placeholder="Enter Address"
    >

    <br>

    <button id="saveBtn" onclick="addFriend()">
        💾 Save
    </button>

    <button id="cancelBtn" onclick="hideForm()">
        ❌ Cancel
    </button>

</div>

<!-- TABLE -->
<div class="table-container">

<table id="friendsTable">

    <thead>
        <tr>
            <th>Photo</th>
            <th>Name</th>
            <th>Phone Number</th>
            <th>Address</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="tableBody">
    </tbody>

</table>

</div>


<script>

/* DEFAULT FRIENDS */

const defaultFriends = [

    {
        name: "AFROZ",
        phone: "+923214429073",
        address: "MOHALLAH RASOOL NAGER",
        photo: "ssss.jpeg"
    },

    {
        name: "Luqman♥️",
        phone: "+923330638966",
        address: "LAHORI BAZAIR",
        photo: "koda.jpeg"
    },

    {
        name: "Hamza",
        phone: "+923271692102",
        address: "MAHRIA TOWN",
        photo: "hamza.jpeg"
    },

    {
        name: "ISMAIL♥️",
        phone: "+923005590340",
        address: "AZEEM TOWN",
        photo: "isma.jpeg"
    },

    {
        name: "ABUBAKER♥️",
        phone: "+923217047036",
        address: "MOHALLAH RASOOL NAGER",
        photo: "tfrt.jpeg"
    },

    {
        name: "ALIAYAN",
        phone: "+923032002840",
        address: "MOHALLAH RASOOL NAGER",
        photo: "ayan.jpeg"
    },

    {
        name: "HARRY",
        phone: "+923187366834",
        address: "CRISTIAN TOWN",
        photo: "harry.jpeg"
    },

    {
        name: "AHMAD BAJWA",
        phone: "+923409377122",
        address: "AZEEM TOWN",
        photo: "bajwa.jpeg"
    },

    {
        name: "AHMAD",
        phone: "+923290887127",
        address: "AZEEM TOWN",
        photo: "ahmad.jpeg"
    }

];


/* LOAD DATA */

let friends = JSON.parse(localStorage.getItem("friends"));

if (!friends) {
    friends = defaultFriends;
    localStorage.setItem("friends", JSON.stringify(friends));
}


/* SHOW FORM */

function showForm() {

    document.getElementById("addForm").style.display = "block";

}


/* HIDE FORM */

function hideForm() {

    document.getElementById("addForm").style.display = "none";

    document.getElementById("nameInput").value = "";
    document.getElementById("phoneInput").value = "";
    document.getElementById("addressInput").value = "";
    document.getElementById("photoInput").value = "";

    document.getElementById("photoPreview").style.display = "none";

}


/* PHOTO PREVIEW */

function previewPhoto(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const preview = document.getElementById("photoPreview");

        preview.src = e.target.result;
        preview.style.display = "block";

    };

    reader.readAsDataURL(file);

}


/* ADD FRIEND */

function addFriend() {

    const name =
        document.getElementById("nameInput").value.trim();

    const phone =
        document.getElementById("phoneInput").value.trim();

    const address =
        document.getElementById("addressInput").value.trim();

    const photoInput =
        document.getElementById("photoInput");

    if (name === "" || phone === "" || address === "") {

        alert("Please enter Name, Phone Number and Address.");

        return;
    }


    /* PHOTO */

    if (photoInput.files.length > 0) {

        const file = photoInput.files[0];

        const reader = new FileReader();

        reader.onload = function(e) {

            saveFriend(
                name,
                phone,
                address,
                e.target.result
            );

        };

        reader.readAsDataURL(file);

    } else {

        saveFriend(
            name,
            phone,
            address,
            ""
        );

    }

}


/* SAVE FRIEND */

function saveFriend(name, phone, address, photo) {

    const newFriend = {

        name: name,
        phone: phone,
        address: address,
        photo: photo

    };

    friends.push(newFriend);

    localStorage.setItem(
        "friends",
        JSON.stringify(friends)
    );

    renderTable();

    hideForm();

    alert("Friend added successfully! ✅");

}


/* DISPLAY TABLE */

function renderTable() {

    const tableBody =
        document.getElementById("tableBody");

    tableBody.innerHTML = "";

    friends.forEach(function(friend, index) {

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>
                ${
                    friend.photo
                    ?
                    `<img
                        src="${friend.photo}"
                        class="profile-img"
                    >`
                    :
                    "👤"
                }
            </td>

            <td>${escapeHTML(friend.name)}</td>

            <td>${escapeHTML(friend.phone)}</td>

            <td>${escapeHTML(friend.address)}</td>

            <td>
                <button
                    class="delete-btn"
                    onclick="deleteFriend(${index})"
                >
                    🗑️ Delete
                </button>
            </td>

        `;

        tableBody.appendChild(row);

    });

}


/* DELETE */

function deleteFriend(index) {

    if (
        confirm(
            "Are you sure you want to delete this friend?"
        )
    ) {

        friends.splice(index, 1);

        localStorage.setItem(
            "friends",
            JSON.stringify(friends)
        );

        renderTable();

    }

}


/* SEARCH */

function searchTable() {

    const search =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase();

    const rows =
        document
        .getElementById("tableBody")
        .getElementsByTagName("tr");

    for (
        let i = 0;
        i < rows.length;
        i++
    ) {

        const text =
            rows[i]
            .innerText
            .toLowerCase();

        if (text.includes(search)) {

            rows[i].style.display = "";

        } else {

            rows[i].style.display = "none";

        }

    }

}


/* SECURITY */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* START */

renderTable();

</script>

</body>
</html>
