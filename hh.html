<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friends Directory</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

/* LOGIN PAGE */

#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: #111;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 35px 25px;
    text-align: center;
}

.login-box h1 {
    margin-bottom: 10px;
}

.login-box p {
    color: #aaa;
    margin-bottom: 25px;
}

.google-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #222;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.google-btn:hover {
    background: #eee;
}

.google-icon {
    font-size: 19px;
    margin-right: 8px;
}

/* WEBSITE */

#websitePage {
    display: none;
    padding: 20px;
}

.header {
    text-align: center;
}

.header h3 {
    color: #00ff88;
    font-size: 25px;
}

.logout-btn {
    background: #e60000;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
}

/* SEARCH */

#searchBox {
    display: block;
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #555;
    font-size: 16px;
}

/* ADD */

#addBtn {
    display: block;
    margin: 15px auto;
    padding: 12px 22px;
    background: #00cc66;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

/* FORM */

#addForm {
    display: none;
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    background: #111;
    border: 1px solid #444;
    border-radius: 12px;
}

#addForm h2 {
    text-align: center;
    color: #00ff88;
}

#addForm input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 7px;
    border: 1px solid #555;
    font-size: 16px;
}

#photoPreview {
    display: none;
    width: 90px;
    height: 90px;
    margin: 10px auto;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #00ff88;
}

.form-buttons {
    text-align: center;
}

.form-buttons button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin: 5px;
}

#saveBtn {
    background: #008cff;
    color: white;
}

#cancelBtn {
    background: #555;
    color: white;
}

/* TABLE */

.table-container {
    width: 100%;
    overflow-x: auto;
    margin-top: 20px;
}

table {
    width: 100%;
    min-width: 750px;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid white;
    padding: 10px;
    text-align: center;
}

th {
    background: #222;
    color: #00ff88;
}

tr:nth-child(even) {
    background: #111;
}

.profile-img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 50%;
}

.delete-btn {
    background: #e60000;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

/* USER */

#userInfo {
    text-align: center;
    margin: 10px;
    color: #aaa;
}

#userPhoto {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 8px;
}

/* MOBILE */

@media (max-width: 600px) {

    #websitePage {
        padding: 10px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header h3 {
        font-size: 21px;
    }
}
</style>
</head>

<body>


<!-- ================================================= -->
<!-- REAL GOOGLE LOGIN PAGE -->
<!-- ================================================= -->

<div id="loginPage">

    <div class="login-box">

        <h1>🔐 Welcome</h1>

        <p>
            Sign in to open Friends Directory
        </p>

        <button
            class="google-btn"
            id="googleLoginBtn"
        >
            <span class="google-icon">G</span>
            Continue with Google
        </button>

    </div>

</div>


<!-- ================================================= -->
<!-- FRIENDS DIRECTORY -->
<!-- ================================================= -->

<div id="websitePage">

    <div class="header">

        <h1>
            Welcome! This is my first website.
        </h1>

        <h3>
            FRIENDS DIRECTORY
        </h3>

        <div id="userInfo"></div>

        <button
            class="logout-btn"
            id="logoutBtn"
        >
            Logout
        </button>

    </div>


    <!-- SEARCH -->

    <input
        type="text"
        id="searchBox"
        placeholder="🔍 Search friend..."
    >


    <!-- ADD NEW -->

    <button id="addBtn">
        ➕ Add New
    </button>


    <!-- ADD FORM -->

    <div id="addForm">

        <h2>Add New Friend</h2>

        <input
            type="file"
            id="photoInput"
            accept="image/*"
        >

        <img
            id="photoPreview"
            alt="Photo Preview"
        >

        <input
            type="text"
            id="nameInput"
            placeholder="Enter Name"
        >

        <input
            type="tel"
            id="phoneInput"
            placeholder="Enter Phone Number"
        >

        <input
            type="text"
            id="addressInput"
            placeholder="Enter Address"
        >

        <div class="form-buttons">

            <button id="saveBtn">
                💾 Save
            </button>

            <button id="cancelBtn">
                ❌ Cancel
            </button>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Address</th>
                    <th>Action</th>
                </tr>

            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>


<!-- ================================================= -->
<!-- FIREBASE -->
<!-- ================================================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


/* ================================================= */
/* YOUR FIREBASE CONFIG */
/* ================================================= */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"

};


/* ================================================= */
/* FIREBASE START */
/* ================================================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const provider =
    new GoogleAuthProvider();


/* ================================================= */
/* GOOGLE LOGIN */
/* ================================================= */

document
.getElementById("googleLoginBtn")
.addEventListener(
    "click",
    async function() {

        try {

            await signInWithPopup(
                auth,
                provider
            );

        }

        catch(error) {

            console.error(error);

            alert(
                "Google Login failed:\n" +
                error.message
            );

        }

    }
);


/* ================================================= */
/* AUTH STATE */
/* ================================================= */

onAuthStateChanged(
    auth,
    function(user) {

        if (user) {

            document
            .getElementById("loginPage")
            .style.display = "none";

            document
            .getElementById("websitePage")
            .style.display = "block";


            const photo =
                user.photoURL
                ?
                `<img id="userPhoto"
                    src="${user.photoURL}">
                `
                :
                "";


            document
            .getElementById("userInfo")
            .innerHTML =
                photo +
                "Signed in as: " +
                escapeHTML(
                    user.displayName || user.email
                );


            renderTable();

        }

        else {

            document
            .getElementById("loginPage")
            .style.display = "flex";

            document
            .getElementById("websitePage")
            .style.display = "none";

        }

    }
);


/* ================================================= */
/* LOGOUT */
/* ================================================= */

document
.getElementById("logoutBtn")
.addEventListener(
    "click",
    async function() {

        await signOut(auth);

    }
);


/* ================================================= */
/* DEFAULT FRIENDS */
/* ================================================= */

const defaultFriends = [

    {
        name: "AFROZ",
        phone: "+923214429073",
        address: "MOHALLAH RASOOL NAGER",
        photo: "ssss.jpeg"
    },

    {
        name: "Luqman♥️",
        phone: "+923330638966",
        address: "LAHORI BAZAIR",
        photo: "koda.jpeg"
    },

    {
        name: "Hamza",
        phone: "+923271692102",
        address: "MAHRIA TOWN",
        photo: "hamza.jpeg"
    },

    {
        name: "ISMAIL♥️",
        phone: "+923005590340",
        address: "AZEEM TOWN",
        photo: "isma.jpeg"
    },

    {
        name: "ABUBAKER♥️",
        phone: "+923217047036",
        address: "MOHALLAH RASOOL NAGER",
        photo: "tfrt.jpeg"
    },

    {
        name: "ALIAYAN",
        phone: "+923032002840",
        address: "MOHALLAH RASOOL NAGER",
        photo: "ayan.jpeg"
    },

    {
        name: "HARRY",
        phone: "+923187366834",
        address: "CRISTIAN TOWN",
        photo: "harry.jpeg"
    },

    {
        name: "AHMAD BAJWA",
        phone: "+923409377122",
        address: "AZEEM TOWN",
        photo: "bajwa.jpeg"
    },

    {
        name: "AHMAD",
        phone: "+923290887127",
        address: "AZEEM TOWN",
        photo: "ahmad.jpeg"
    }

];


/* ================================================= */
/* FRIEND DATA */
/* ================================================= */

let friends =
    JSON.parse(
        localStorage.getItem("friends")
    );

if (!friends) {

    friends = defaultFriends;

    localStorage.setItem(
        "friends",
        JSON.stringify(friends)
    );

}


/* ================================================= */
/* ADD FORM */
/* ================================================= */

document
.getElementById("addBtn")
.addEventListener(
    "click",
    function() {

        document
        .getElementById("addForm")
        .style.display = "block";

    }
);


document
.getElementById("cancelBtn")
.addEventListener(
    "click",
    hideForm
);


function hideForm() {

    document
    .getElementById("addForm")
    .style.display = "none";

    document
    .getElementById("nameInput")
    .value = "";

    document
    .getElementById("phoneInput")
    .value = "";

    document
    .getElementById("addressInput")
    .value = "";

    document
    .getElementById("photoInput")
    .value = "";

    document
    .getElementById("photoPreview")
    .style.display = "none";

}


/* ================================================= */
/* PHOTO PREVIEW */
/* ================================================= */

document
.getElementById("photoInput")
.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                const preview =
                    document.getElementById(
                        "photoPreview"
                    );

                preview.src =
                    e.target.result;

                preview.style.display =
                    "block";

            };

        reader.readAsDataURL(file);

    }
);


/* ================================================= */
/* ADD FRIEND */
/* ================================================= */

document
.getElementById("saveBtn")
.addEventListener(
    "click",
    addFriend
);


function addFriend() {

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    const phone =
        document
        .getElementById("phoneInput")
        .value
        .trim();

    const address =
        document
        .getElementById("addressInput")
        .value
        .trim();

    const photoInput =
        document
        .getElementById("photoInput");


    if (
        name === "" ||
        phone === "" ||
        address === ""
    ) {

        alert(
            "Please enter Name, Phone Number and Address."
        );

        return;

    }


    if (
        photoInput.files.length > 0
    ) {

        const file =
            photoInput.files[0];

        const reader =
            new FileReader();

        reader.onload =
            function(e) {

                saveFriend(
                    name,
                    phone,
                    address,
                    e.target.result
                );

            };

        reader.readAsDataURL(file);

    }

    else {

        saveFriend(
            name,
            phone,
            address,
            ""
        );

    }

}


/* ================================================= */
/* SAVE FRIEND */
/* ================================================= */

function saveFriend(
    name,
    phone,
    address,
    photo
) {

    friends.push({

        name: name,
        phone: phone,
        address: address,
        photo: photo

    });


    localStorage.setItem(
        "friends",
        JSON.stringify(friends)
    );


    renderTable();

    hideForm();

}


/* ================================================= */
/* RENDER TABLE */
/* ================================================= */

function renderTable() {

    const tableBody =
        document.getElementById(
            "tableBody"
        );

    tableBody.innerHTML = "";


    friends.forEach(
        function(friend, index) {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>

                    ${
                        friend.photo
                        ?
                        `
                        <img
                            src="${friend.photo}"
                            class="profile-img"
                        >
                        `
                        :
                        "👤"
                    }

                </td>

                <td>
                    ${escapeHTML(friend.name)}
                </td>

                <td>
                    ${escapeHTML(friend.phone)}
                </td>

                <td>
                    ${escapeHTML(friend.address)}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        data-index="${index}"
                    >
                        🗑️ Delete
                    </button>

                </td>
            `;


            row
            .querySelector(".delete-btn")
            .addEventListener(
                "click",
                function() {

                    deleteFriend(index);

                }
            );


            tableBody.appendChild(row);

        }
    );

}


/* ================================================= */
/* DELETE */
/* ================================================= */

function deleteFriend(index) {

    if (
        confirm(
            "Are you sure you want to delete this friend?"
        )
    ) {

        friends.splice(
            index,
            1
        );

        localStorage.setItem(
            "friends",
            JSON.stringify(friends)
        );

        renderTable();

    }

}


/* ================================================= */
/* SEARCH */
/* ================================================= */

document
.getElementById("searchBox")
.addEventListener(
    "input",
    function() {

        const search =
            this.value.toLowerCase();

        const rows =
            document
            .getElementById("tableBody")
            .getElementsByTagName("tr");


        for (
            let i = 0;
            i < rows.length;
            i++
        ) {

            const text =
                rows[i]
                .innerText
                .toLowerCase();

            rows[i].style.display =
                text.includes(search)
                ? ""
                : "none";

        }

    }
);


/* ================================================= */
/* SECURITY */
/* ================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
            </html>
