/* ================================================= */
/* GOOGLE LOGIN */
/* ================================================= */

            auth,
            provider

};

};

/* ================================================= */
/* SHOW FORM */
/* ================================================= */

window.showForm = function () {

    document.getElementById(
        "addForm"
    ).style.display = "block";

};


/* ================================================= */
/* HIDE FORM */
/* ================================================= */

window.hideForm = function () {

    document.getElementById(
        "addForm"
    ).style.display = "none";

    document.getElementById(
        "nameInput"
    ).value = "";

    document.getElementById(
        "phoneInput"
    ).value = "";

    document.getElementById(
        "addressInput"
    ).value = "";

    document.getElementById(
        "photoInput"
    ).value = "";

    document.getElementById(
        "photoPreview"
    ).style.display = "none";

};


/* ================================================= */
/* PHOTO PREVIEW */
/* ================================================= */

window.previewPhoto = function (event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function (e) {

            const preview =
                document.getElementById(
                    "photoPreview"
                );


            preview.src =
                e.target.result;


            preview.style.display =
                "block";

        };


    reader.readAsDataURL(file);

};


/* ================================================= */
/* ADD FRIEND */
/* ================================================= */

window.addFriend = function () {

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim();


    const phone =
        document
        .getElementById("phoneInput")
        .value
        .trim();


    const address =
        document
        .getElementById("addressInput")
        .value
        .trim();


    const photoInput =
        document.getElementById(
            "photoInput"
        );


    if (
        name === "" ||
        phone === "" ||
        address === ""
    ) {

        alert(
            "Please enter Name, Phone Number and Address."
        );

        return;

    }


    if (
        photoInput.files.length > 0
    ) {

        const file =
            photoInput.files[0];


        const reader =
            new FileReader();


        reader.onload =
            function (e) {

                saveFriend(
                    name,
                    phone,
                    address,
                    e.target.result
                );

            };


        reader.readAsDataURL(file);

    }

    else {

        saveFriend(
            name,
            phone,
            address,
            ""
        );

    }

};


/* ================================================= */
/* SAVE FRIEND */
/* ================================================= */

function saveFriend(
    name,
    phone,
    address,
    photo
) {

    friends.push({

        name: name,

        phone: phone,

        address: address,

        photo: photo

    });


    localStorage.setItem(
        "friends",
        JSON.stringify(friends)
    );


    renderTable();

    window.hideForm();


    alert(
        "Friend added successfully! ✅"
    );

}


/* ================================================= */
/* DISPLAY TABLE */
/* ================================================= */

function renderTable() {

    const tableBody =
        document.getElementById(
            "tableBody"
        );


    tableBody.innerHTML = "";


    friends.forEach(
        function (friend, index) {

            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>

                    ${
                        friend.photo
                        ?
                        `
                        <img
                            src="${friend.photo}"
                            class="profile-img"
                        >
                        `
                        :
                        "👤"
                    }

                </td>


                <td>
                    ${escapeHTML(friend.name)}
                </td>


                <td>
                    ${escapeHTML(friend.phone)}
                </td>


                <td>
                    ${escapeHTML(friend.address)}
                </td>


                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteFriend(${index})"
                    >
                        🗑️ Delete
                    </button>

                </td>

            `;


            tableBody.appendChild(
                row
            );

        }
    );

}


/* ================================================= */
/* DELETE FRIEND */
/* ================================================= */

window.deleteFriend = function (index) {

    if (
        confirm(
            "Are you sure you want to delete this friend?"
        )
    ) {

        friends.splice(
            index,
            1
        );


        localStorage.setItem(
            "friends",
            JSON.stringify(friends)
        );


        renderTable();

    }

};


/* ================================================= */
/* SEARCH */
/* ================================================= */

window.searchTable = function () {

    const search =
        document
        .getElementById("searchBox")
        .value
        .toLowerCase();


    const rows =
        document
        .getElementById("tableBody")
        .getElementsByTagName("tr");


    for (
        let i = 0;
        i < rows.length;
        i++
    ) {

        const text =
            rows[i]
            .innerText
            .toLowerCase();


        if (
            text.includes(search)
        ) {

            rows[i].style.display =
                "";

        }

        else {

            rows[i].style.display =
                "none";

        }

    }

};


/* ================================================= */
/* SECURITY */
/* ================================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
