<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends Directory</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    font-family: Arial, sans-serif;
}

/* LOGIN / SIGNUP */
#loginPage {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: #111;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 0 25px rgba(255,255,255,0.08);
}

.login-box h1 {
    margin-bottom: 8px;
}

.login-box p {
    color: #aaa;
    margin-bottom: 20px;
}

.login-box input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: white;
    font-size: 15px;
}

.auth-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #008cff;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.divider {
    margin: 18px 0;
    color: #666;
    font-size: 14px;
}

.google-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: white;
    color: #222;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.toggle-mode {
    margin-top: 18px;
    color: #00ff88;
    cursor: pointer;
    text-decoration: underline;
    font-size: 14px;
}

/* WEBSITE */
#websitePage {
    display: none;
    padding: 20px;
}

.header {
    text-align: center;
}

.header h1 {
    margin-bottom: 8px;
}

.header h3 {
    color: #00ff88;
    font-size: 25px;
}

.user-info {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 12px;
}

.logout-btn {
    background: #e60000;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

/* SEARCH & ADD */
#searchBox {
    display: block;
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #111;
    color: white;
    font-size: 16px;
}

#addBtn {
    display: block;
    margin: 15px auto;
    padding: 12px 22px;
    background: #00cc66;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#addForm {
    display: none;
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    background: #111;
    border: 1px solid #444;
    border-radius: 12px;
}

#addForm h2 {
    text-align: center;
    color: #00ff88;
}

#addForm input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 7px;
    border: 1px solid #555;
    background: #222;
    color: white;
    font-size: 16px;
}

#photoPreview {
    display: none;
    width: 90px;
    height: 90px;
    margin: 10px auto;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid #00ff88;
}

.form-buttons {
    text-align: center;
    margin-top: 10px;
}

.form-buttons button {
    padding: 11px 18px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin: 5px;
    font-weight: bold;
}

#saveBtn { background: #008cff; color: white; }
#cancelBtn { background: #555; color: white; }

/* TABLE */
.table-container {
    width: 100%;
    overflow-x: auto;
    margin-top: 20px;
}

table {
    width: 100%;
    min-width: 750px;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #333;
    padding: 10px;
    text-align: center;
}

th {
    background: #222;
    color: #00ff88;
}

tr:nth-child(even) { background: #111; }

.profile-img {
    width: 55px;
    height: 55px;
    object-fit: cover;
    border-radius: 50%;
}

.delete-btn {
    background: #e60000;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- AUTH / LOGIN PAGE -->
<div id="loginPage">
    <div class="login-box">
        <h1 id="authTitle">🔐 Welcome</h1>
        <p id="authSub">Sign in to access Friends Directory</p>

        <!-- Email & Password Form -->
        <input type="email" id="emailInput" placeholder="Email Address">
        <input type="password" id="passwordInput" placeholder="Password (min 6 chars)">
        
        <button class="auth-btn" id="emailAuthBtn" onclick="handleEmailAuth()">Sign In</button>

        <div class="divider">────── OR ──────</div>

        <!-- Google Login -->
        <button class="google-btn" onclick="googleLogin()">
            🌐 Continue with Google
        </button>

        <div class="toggle-mode" id="toggleAuthMode" onclick="toggleMode()">
            Don't have an account? Sign Up
        </div>
    </div>
</div>

<!-- MAIN WEBSITE -->
<div id="websitePage">
    <div class="header">
        <h1>Welcome!</h1>
        <div class="user-info" id="userDisplay">Logged in as: ...</div>
        <h3>FRIENDS DIRECTORY</h3>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- SEARCH -->
    <input type="text" id="searchBox" placeholder="🔍 Search friend..." onkeyup="searchTable()">

    <!-- ADD BUTTON -->
    <button id="addBtn" onclick="showForm()">➕ Add New</button>

    <!-- ADD FORM -->
    <div id="addForm">
        <h2>Add New Friend</h2>
        <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(event)">
        <img id="photoPreview" alt="Photo Preview">
        <input type="text" id="nameInput" placeholder="Enter Name">
        <input type="tel" id="phoneInput" placeholder="Enter Phone Number">
        <input type="text" id="addressInput" placeholder="Enter Address">

        <div class="form-buttons">
            <button id="saveBtn" onclick="addFriend()">💾 Save</button>
            <button id="cancelBtn" onclick="hideForm()">❌ Cancel</button>
        </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Phone Number</th>
                    <th>Address</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- FIREBASE SDK & APP SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { 
    getAuth, 
    GoogleAuthProvider, 
    signInWithPopup, 
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged, 
    signOut 
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
    apiKey: "AIzaSyBl9aJn1h05COwHRpJCkUtCdalhynVHPQM",
    authDomain: "friend-dff9f.firebaseapp.com",
    projectId: "friend-dff9f",
    storageBucket: "friend-dff9f.firebasestorage.app",
    messagingSenderId: "409798205367",
    appId: "1:409798205367:web:8802ad52ad1103a501d232",
    measurementId: "G-5DWVDHW3RY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let isSignUpMode = false;

/* TOGGLE LOGIN / SIGNUP MODE */
window.toggleMode = function() {
    isSignUpMode = !isSignUpMode;
    const title = document.getElementById("authTitle");
    const sub = document.getElementById("authSub");
    const btn = document.getElementById("emailAuthBtn");
    const toggleBtn = document.getElementById("toggleAuthMode");

    if (isSignUpMode) {
        title.innerText = "📝 Create Account";
        sub.innerText = "Sign up to start managing directory";
        btn.innerText = "Sign Up";
        toggleBtn.innerText = "Already have an account? Sign In";
    } else {
        title.innerText = "🔐 Welcome";
        sub.innerText = "Sign in to access Friends Directory";
        btn.innerText = "Sign In";
        toggleBtn.innerText = "Don't have an account? Sign Up";
    }
};

/* EMAIL & PASSWORD AUTHENTICATION */
window.handleEmailAuth = async function() {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value.trim();

    if (!email || !password) {
        alert("Please fill in both Email and Password.");
        return;
    }

    try {
        if (isSignUpMode) {
            await createUserWithEmailAndPassword(auth, email, password);
            alert("Account created successfully!");
        } else {
            await signInWithEmailAndPassword(auth, email, password);
        }
    } catch (error) {
        console.error(error);
        alert("Authentication Error:\n" + error.message);
    }
};

/* GOOGLE LOGIN */
window.googleLogin = async function () {
    try {
        await signInWithPopup(auth, provider);
    } catch (error) {
        console.error(error);
        alert("Google Sign-In Error:\n" + error.message);
    }
};

/* LOGOUT */
window.logout = async function () {
    try {
        await signOut(auth);
    } catch (error) {
        alert("Logout Error:\n" + error.message);
    }
};

/* REAL-TIME AUTH STATE MONITOR */
onAuthStateChanged(auth, (user) => {
    const loginPage = document.getElementById("loginPage");
    const websitePage = document.getElementById("websitePage");
    const userDisplay = document.getElementById("userDisplay");

    if (user) {
        loginPage.style.display = "none";
        websitePage.style.display = "block";
        userDisplay.innerText = "Logged in as: " + (user.displayName || user.email);
        renderTable();
    } else {
        loginPage.style.display = "flex";
        websitePage.style.display = "none";
    }
});

/* LOCAL STORAGE DATA & APP LOGIC */
const defaultFriends = [
    { name: "AFROZ", phone: "+923214429073", address: "MOHALLAH RASOOL NAGER", photo: "afroz.jpeg" },
    { name: "Luqman♥️", phone: "+923330638966", address: "LAHORI BAZAIR", photo: "koda.jpeg" },
    { name: "Hamza", phone: "+923271692102", address: "MAHRIA TOWN", photo: "hamza.jpeg" },
    { name: "ISMAIL♥️", phone: "+923005590340", address: "AZEEM TOWN", photo: "isma.jpeg" },
    { name: "ABUBAKER♥️", phone: "+923217047036", address: "MOHALLAH RASOOL NAGER", photo: "tfrt.jpeg" }
];

let friends = JSON.parse(localStorage.getItem("friends")) || defaultFriends;
let currentPhotoBase64 = "";

window.showForm = function () {
    document.getElementById("addForm").style.display = "block";
};

window.hideForm = function () {
    document.getElementById("addForm").style.display = "none";
    document.getElementById("nameInput").value = "";
    document.getElementById("phoneInput").value = "";
    document.getElementById("addressInput").value = "";
    document.getElementById("photoInput").value = "";
    document.getElementById("photoPreview").style.display = "none";
    currentPhotoBase64 = "";
};

window.previewPhoto = function (event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
            currentPhotoBase64 = e.target.result;
            const preview = document.getElementById("photoPreview");
            preview.src = currentPhotoBase64;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }
};

window.addFriend = function () {
    const name = document.getElementById("nameInput").value.trim();
    const phone = document.getElementById("phoneInput").value.trim();
    const address = document.getElementById("addressInput").value.trim();

    if (!name || !phone || !address) {
        alert("Please fill in all fields.");
        return;
    }

    const newFriend = {
        name,
        phone,
        address,
        photo: currentPhotoBase64 || "https://via.placeholder.com/150"
    };

    friends.push(newFriend);
    localStorage.setItem("friends", JSON.stringify(friends));
    renderTable();
    window.hideForm();
};

window.deleteFriend = function (index) {
    if (confirm("Are you sure you want to delete this contact?")) {
        friends.splice(index, 1);
        localStorage.setItem("friends", JSON.stringify(friends));
        renderTable();
    }
};

window.searchTable = function () {
    const filter = document.getElementById("searchBox").value.toUpperCase();
    const rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row => {
        const text = row.innerText.toUpperCase();
        row.style.display = text.includes(filter) ? "" : "none";
    });
};

function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    friends.forEach((friend, index) => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>
                <img 
                    src="${friend.photo}" 
                    alt="${friend.name}" 
                    class="profile-img"
                    onerror="this.src='https://via.placeholder.com/150'"
                >
            </td>
            <td>${friend.name}</td>
            <td>${friend.phone}</td>
            <td>${friend.address}</td>
            <td>
                <button class="delete-btn" onclick="deleteFriend(${index})">
                    🗑️ Delete
                </button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}
</script>
</body>
        </html>
